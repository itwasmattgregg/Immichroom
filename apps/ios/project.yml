name: Immichroom
options:
  bundleIdPrefix: com.immichroom
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Immichroom:
    type: application
    platform: iOS
    sources:
      - path: Immichroom
      - path: Generated/immichroom_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.immichroom.app
        INFOPLIST_GENERATION_MODE: GeneratedFile
        INFOPLIST_KEY_CFBundleDisplayName: IMMICHROOM
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: ["-framework", "SystemConfiguration", "-framework", "Security"]
        LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/Rust"]
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)/Rust/Headers"]
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_USER_SCRIPT_SANDBOXING: false
    dependencies:
      - framework: Rust/ImmichroomFFI.xcframework
        embed: false
    preBuildScripts:
      - name: Build Rust XCFramework
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Skip if already built (CI/local cache)
          if [ -d "${PROJECT_DIR}/Rust/ImmichroomFFI.xcframework" ]; then
            echo "Rust XCFramework present"
            exit 0
          fi
          "${PROJECT_DIR}/scripts/build-xcframework.sh"
